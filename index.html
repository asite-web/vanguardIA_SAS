<style>
:root{--nav:#0A192F;--blue:#2563EB;--teal:#0EA5E9;--mint:#14B8A6;--bg:#F4F7FB;--card:#FFFFFF;--tx:#0F172A;--mut:#475569;--bd:#E2E8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.dots{display:flex;gap:5px;padding:14px 16px}.dots i{width:8px;height:8px;border-radius:50%;background:#94A3B8;animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

.hero{background-size:200% 200%;animation:grad 16s ease infinite}@keyframes grad{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.flow path{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-28}}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none}.app{position:relative;z-index:1}
.hero h1 .sh{background:linear-gradient(90deg,#fff,#7DD3FC,#5EEAD4,#fff);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}@keyframes shine{to{background-position:-220% 0}}
.rv{opacity:0}.rv.in{opacity:1;animation:pop .65s cubic-bezier(.2,.8,.2,1) var(--d,0ms) backwards}@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}}
button.card{position:relative;overflow:hidden}button.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(14,165,233,.16),transparent 60%)}button.card:hover::before{opacity:1}
.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .7s}.btn:hover::after{left:140%}

.mq{overflow:hidden;margin:20px 0 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}.mqt{display:flex;width:max-content;animation:mq 34s linear infinite}.mq:hover .mqt{animation-play-state:paused}.mqt span{white-space:nowrap;margin-right:12px;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:8px 16px;font-size:14px;box-shadow:0 2px 8px rgba(15,23,42,.05)}@keyframes mq{to{transform:translateX(-50%)}}
.flowx{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.fx{position:relative;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}.fx p{color:var(--mut);font-size:14px}.fe{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;font-size:24px;margin-bottom:8px;background:linear-gradient(135deg,#DBEAFE,#CCFBF1);animation:pulse 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.5s)}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14);box-shadow:0 0 0 8px rgba(14,165,233,.12)}}
.fx:not(:last-child)::after{content:"➜";position:absolute;right:-19px;top:42%;color:var(--teal);font-size:18px;animation:nudge 1.3s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(5px)}}
@media(max-width:820px){.flowx{grid-template-columns:1fr 1fr}.fx:not(:last-child)::after{display:none}}@media(max-width:520px){.flowx{grid-template-columns:1fr}}

<script>

const D={"cargos":[{"n":1,"t":"Presidente / Chief Executive Officer (CEO)","c":0,"fn":["Definir la estrategia general y el plan quinquenal de crecimiento de la compañía.","Aprobar inversiones en infraestructura, fibra, spectrum y despliegue de red.","Representar a la compañía ante la Junta Directiva, el Gobierno, MinTIC, CRC y accionistas.","Liderar el comité ejecutivo (COO, CFO, CTO, CIO, CISO) y evaluar el desempeño general del negocio."],"q":["¿Qué decisiones estratégicas corresponden al CEO?","¿Cómo se diferencia la responsabilidad del CEO de la del COO?"],"s":"CEO","f":"Archivo original «Cargos.docx», apartado 1, páginas 1.","d":"Definir el rumbo estratégico, las prioridades de expansión y los resultados financieros globales de Vanguardia Telecom S.A.S.","k":"Gobierno corporativo, estrategia, liderazgo ejecutivo, asignación de capital y gestión de partes interesadas.","a":"Junta Directiva, Vicepresidentes y Directores.","i":"EBITDA, retorno de capital invertido (ROIC), participación de mercado y satisfacción global del cliente.","l":"No aprueba operaciones técnicas diarias ni reemplaza las decisiones exclusivas de la Junta Directiva.","fo":["Definir la estrategia general de la empresa.","Establecer objetivos de crecimiento, rentabilidad y participación de mercado.","Representar a la compañía ante accionistas, gobierno, reguladores y otros actores.","Aprobar grandes inversiones en infraestructura, tecnología y expansión.","Coordinar a vicepresidentes y directores de las diferentes áreas.","Tomar decisiones sobre adquisiciones, alianzas y proyectos estratégicos.","Responder ante la junta directiva por los resultados de la compañía."]},{"n":2,"t":"Director de Operaciones / Chief Operating Officer (COO)","c":0,"fn":["Coordinar la prestación continua de servicios fijos, móviles, internet y televisión.","Controlar la disponibilidad del servicio, tiempos de respuesta y niveles de servicio (SLA).","Liderar la integración entre las áreas técnicas, comercial, experiencia del cliente y abastecimiento.","Diseñar e implementar programas de eficiencia operativa y reducción de costos de operación (OPEX)."],"q":["¿Qué indicadores permiten evaluar la operación diaria?","¿Cómo coordina el COO a las áreas técnicas y de servicio?"],"s":"COO","f":"Archivo original «Cargos.docx», apartado 2, páginas 1–2.","d":"Traducir la visión estratégica en una operación rentable, continua, eficiente y con altos estándares de calidad.","k":"Gestión de operaciones, continuidad del servicio, calidad, productividad, procesos y coordinación transversal.","a":"CEO, CTO, Director de Redes, Director de Experiencia del Cliente y Proveedores.","i":"Cumplimiento de SLA, OPEX por usuario (ARPU vs. Costo), tiempo medio de resolución (MTTR) global.","l":"No define la arquitectura de red ni decide políticas legales corporativas.","fo":["Supervisar las operaciones de telecomunicaciones.","Coordinar la prestación de servicios móviles, internet, telefonía y televisión.","Controlar indicadores de calidad y disponibilidad.","Gestionar procesos operativos y centros de atención.","Coordinar áreas técnicas, de servicio y operaciones.","Mejorar eficiencia y productividad.","Garantizar el cumplimiento de los niveles de servicio."]},{"n":3,"t":"Director de Tecnología / Chief Technology Officer (CTO)","c":1,"fn":["Planificar la hoja de ruta tecnológica (5G, redes de fibra FTTH, migración a nube y automatización).","Definir la arquitectura general de las redes de transporte, radioacceso y core.","Evaluar y seleccionar proveedores de tecnología y fabricantes de equipamiento de red.","Garantizar la interoperabilidad y escalabilidad de las plataformas tecnológicas."],"q":["¿Qué decisiones tecnológicas suelen recaer en el CTO?","¿Cómo se diferencia el CTO del CIO y del Director de Redes?"],"s":"CTO","f":"Archivo original «Cargos.docx», apartado 3, páginas 2.","d":"Dirigir la visión y evolución tecnológica de la red y plataformas digitales de la compañía.","k":"Arquitectura tecnológica, e  red móvil.","Administrar redes de fibra óptica y redes de acceso.","Supervisar antenas, estaciones base y nodos.","Gestionar el core de la red.","Supervisar capacidad y cobertura.","Planificar ampliaciones de infraestructura.","Coordinar mantenimiento preventivo y correctivo.","Gestionar incidentes y fallas críticas.","Garantizar disponibilidad y calidad de la red."]},{"n":5,"t":"Director de Ingeniería y Planificación de Red","c":1,"fn":["Realizar estudios de tráfico, propagación RF y diseño de enlaces de fibra.","Planificar la ubicación estratégica de nuevas estaciones base y nodos de distribución.","Elaborar los presupuestos de inversión en capital (CAPEX) para ampliación de red.","Definir las especificaciones técnicas para adquisición de hardware y software de red."],"q":["¿Cómo se decide dónde ampliar cobertura?","¿Qué información se necesita para dimensionar capacidad?"],"s":"Director de Ingeniería y Planificación de Red","f":"Archivo original «Cargos.docx», apartado 5, páginas 3.","d":"Diseñar la arquitectura técnica futura y dimensionar la capacidad y cobertura para responder a la demanda de tráfico.","k":"Modelado de tráfico, diseño de arquitectura, estudios de factibilidad, dimensionamiento y planificación de inversión.","a":"CTO, Director de Redes, Infraestructura y Construcción, Finanzas y Gestión de Espectro.","i":"Precisión en predicción de tráfico, costo por sitio desplegado, cobertura alcanzada vs. planificada.","l":"Diseñar una ampliación no equivale a aprobar el presupuesto final ni ejecutar las obras civiles.","fo":["Diseñar la arquitectura futura de la red.","Determinar dónde construir nuevas estaciones.","Dimensionar capacidad.","Planificar ampliaciones de cobertura.","Analizar tráfico y consumo de los usuarios.","Realizar estudios de factibilidad.","Definir tecnologías y equipos.","Elaborar presupuestos de expansión."]},{"n":6,"t":"Director de Ciberseguridad / Chief Information Security Officer (CISO)","c":2,"fn":["Diseñar e implementar el Sist General Counsel)","c":4,"fn":["Elaborar y revisar todos los contratos comerciales, laborales, de arrendamiento de infraestructura y licitaciones.","Representar a Vanguardia Telecom en procesos judiciales, demandas y litigios procesales.","Asesorar operaciones corporativas, fusiones, adquisiciones y financiamientos internacionales.","Administrar la propiedad intelectual, marcas y patentes de la organización."],"q":["¿Qué asuntos debe escalarse al área jurídica?","¿Qué diferencia existe entre asesoría jurídica y gestión regulatoria?"],"s":"General Counsel","f":"Archivo original «Cargos.docx», apartado 14, páginas 9.","d":"Asesorar legalmente a la empresa, mitigar riesgos contractuales/litigiosos y garantizar el cumplimiento normativo general.","k":"Revisión contractual, litigios, gobierno corporativo, propiedad intelectual, transacciones y asesoría legal.","a":"CEO, Asuntos Regulatorios, Recursos Humanos, Compras y Finanzas.","i":"Tiempo de respuesta en revisión de contratos, índice de contingencias legales, éxito en litigios.","l":"Emite conceptos legales; no reemplaza la gestión regulatoria especializada ante las autoridades.","fo":["Asesorar jurídicamente a la organización.","Revisar contratos.","Gestionar litigios.","Analizar normas.","Coordinar asuntos regulatorios.","Asesorar operaciones corporativas.","Revisar fusiones, adquisiciones y alianzas.","Gestionar propiedad intelectual."]},{"n":15,"t":"Director de Asuntos Regulatorios","c":4,"fn":["Analizar cambios normativos e interpretar resoluciones de la CRC y decretos de MinTIC.","Gestionar la renovación de títulos habilitantes, licencias de telecomunicaciones y permisos.","Responder a requerimientos formales, investigaciones e informes periódicos exigidos por las autoridades.","Coordinar mesas de trabajo en temas de interconexión, portabilidad numérica y régimen de protección al usuario."],"q":["¿Cómo se evalúa el impacto de una nueva regulación?","¿Cuándo debe comprobarse una obligación en fuentes oficiales?"],"s":"Director de Asuntos Regulatorios","f":"Archivo original «Cargos.docx», apartado 15, páginas 9–10.","d":"Representar a la compañía ante los entes reguladores del sector telecomunicaciones (MinTIC, CRC, SIC) y vigilar el cumplimiento normativo.","k":"Seguimiento normativo, análisis de impacto, reportes, consultas y coordinación con autoridades.","a":"Jurídica, Dirección de Espectro, Redes, Comercial y Autoridades Regulatorias.","i":"Cumplimiento de entregas regulatorias (0 multas por extemporaneidad), mitigación de sanciones.","l":"Se enfoca en normativas específicas del sector telecomunicaciones.","fo":["Analizar regulación del sector.","Mantener relaciones con entidades regulatorias.","Preparar respuestas a consultas regulatorias.","Gestionar obligaciones de la compañía.","Analizar cambios normativos.","Participar en discusiones regulatorias.","Coordinar temas relacionados con espectro radioeléctrico.","Evaluar impactos de nuevas regulaciones."]},{"n":16,"t":"Director de Gestión de Espectro Radioeléctrico","c":1,"fn":["Diseñar el plan técnico para la optimización y uso de bandas asignadas (700 MHz, 1.9 GHz, 2.5 GHz, 3.5 GHz).","Coordinar la participación de Vanguardia Telecom en subastas públicas de espectro convocadas por MinTIC.","Monitorear e identificar fuentes de interferencia radioeléctrica que afecten la calidad de señal.","Garantizar el cumplimiento de topes de espectro y pagos por uso de frecuencias."],"q":["¿Qué es el espectro radioeléctrico y por qué es importante?","¿Cómo se relaciona la gestión de espectro con Ingeniería y Regulación?"],"s":"Director de Gestión de Espectro","f":"Archivo original «Cargos.docx», apartado 16, páginas 10.","d":"Planificar, optimizar y administrar el uso legal y eficiente de las bandas de frecuencia asignadas a la compañía.","k":"Planificación de frecuencias, necesidades futuras, análisis técnico, coordinación regulatoria y optimización.","a":"Asuntos Regulatorios, Ingeniería de Red, CTO y MinTIC/ANE.","i":"Eficiencia espectral, mitigación de interferencias reportadas, cumplimiento del plan de uso de frecuencia.","l":"Requiere estrecha coordinación con Ingeniería de Red para la aplicación práctica en antenas.","fo":["Administrar el espectro radioeléctrico asignado.","Analizar necesidades futuras de espectro.","Participar en procesos de asignación.","Coordinar aspectos técnicos del uso de frecuencias.","Optimizar utilización del espectro.","Analizar nuevas bandas para tecnologías futuras.","Coordinar aspectos regulatorios relacionados con espectro."]},{"n":17,"t":"Director de Analítica y Datos / Chief Data Officer (CDO)","c":2,"fn":["Establecer las políticas de Gobierno de Datos, calidad de información y trazabilidad.","Desarrollar modelos predictivos de analítica avanzada para anticipar la fuga de clientes (Churn Prediction).","Analizar patrones de tráfico y uso de red para apoyar la planificación comercial y técnica.","Crear paneles de control ejecutivos (Dashboards) para medición de negocio en tiempo real."],"q":["¿Cómo se usa la analítica para anticipar cancelaciones?","¿Qué precauciones deben tenerse al usar datos de clientes?"],"s":"Chief Data Officer","f":"Archivo original «Cargos.docx», apartado 17, páginas 10–11.","d":"Transformar los grandes volúmenes de datos operativos y de clientes en conocimiento estratégico para la toma de decisiones.","k":"Gobierno y calidad de datos, analítica, modelos predictivos, medición, IA y acceso responsable a datos.","a":"CIO, Marketing, Comercial, Redes, Experiencia del Cliente y CISO.","i":"Calidad de datos corporativa, precisión de los modelos predictivos de Churn, nivel de adopción de la analítica.","l":"Garantiza el uso ético y legal de datos respetando las políticas de privacidad y Hábeas Data.","fo":["Administrar datos corporativos.","Desarrollar modelos predictivos.","Analizar comportamiento de clientes.","Identificar oportunidades comerciales.","Predecir cancelaciones o churn.","Analizar tráfico de red.","Apoyar decisiones mediante inteligencia artificial.","Gestionar gobierno y calidad de datos."]},{"n":18,"t":"Director de Recursos Humanos / Chief Human Resources Officer (CHRO)","c":4,"fn":["Diseñar y coordinar los procesos de reclutamiento, selección y contratación de personal técnico y administrativo.","Implementar programas de capacitación técnica continuada en nuevas tecnologías de red.","Administrar la estructura salarial, beneficios, evaluación del desempeño y clima laboral.","Liderar la gestión de la seguridad y salud en el trabajo (SG-SST)."],"q":["¿Qué procesos de talento humano cubre el CHRO?","¿Qué información laboral debe validarse con las políticas de la empresa?"],"s":"CHRO","f":"Archivo original «Cargos.docx», apartado 18, páginas 11.","d":"Gestionar el talento humano, el desarrollo organizacional, la cultura interna y el bienestar de los colaboradores.","k":"Selección, capacitación, compensación, desempeño, relaciones laborales, bienestar y sucesión.","a":"CEO, Directores de área, Finanzas y Jurídica.","i":"Tasa de rotación no deseada, tiempo medio de cobertura de vacantes, índice de clima organizacional.","l":"Las contrataciones y cambios deben ajustarse al presupuesto aprobado por Finanzas.","fo":["Gestionar contratación y selección.","Promover desarrollo profesional.","Coordinar capacitación.","Administrar salarios y compensación.","Evaluar desempeño.","Gestionar cultura organizacional.","Atender relaciones laborales.","Planificar sucesión.","Promover bienestar de empleados."]},{"n":19,"t":"Director de Soluciones Empresariales (Director B2B)","c":3,"fn":["Diseñar la estrategia de ventas consultivas para grandes cuentas, PyMEs y sector público.","Estructurar soluciones integradas: enlaces dedicados de fibra, MPLS, SD-WAN, Cloud PBX, ciberseguridad e IoT.","Garantizar el cumplimiento de contratos corporativos bajo Acuerdos de Nivel de Servicio (SLA) exigentes.","Liderar licitaciones públicas para conectividad estatal."],"q":["¿Qué diferencia el negocio B2B del mercado de consumidores?","¿Qué áreas deben validar una solución empresarial antes de ofertarla?"],"s":"Director B2B","f":"Archivo original «Cargos.docx», apartado 19, páginas 11–12.","d":"Liderar el portafolio de telecomunicaciones, conectividad dedicada, nube y soluciones digitales para corporaciones y gobierno.","k":"Gestión de cuentas, venta consultiva, soluciones de conectividad, nube, IoT, ciberseguridad y contratos.","a":"Comercial, Producto, CTO, Redes, Jurídica y Clientes Corporativos.","i":"Ingresos totales B2B, cumplimiento de SLA corporativo, tasa de renovación de contratos.","l":"Las soluciones a medida deben ser factibles técnicamente según validación previa de Redes.","fo":["Gestionar clientes empresariales.","Diseñar soluciones de telecomunicaciones para empresas.","Administrar grandes cuentas.","Desarrollar servicios de conectividad.","Vender soluciones de nube.","Ofrecer soluciones de ciberseguridad.","Desarrollar soluciones IoT.","Administrar soluciones de comunicaciones unificadas.","Gestionar contratos corporativos."]},{"n":20,"t":"Director de Infraestructura y Construcción","c":1,"fn":["Gestionar y supervisar contratistas de obra civil para la construcción de nuevos sitios y nodos.","Tramitar licencias ambientales, permisos municipales de construcción y acuerdos con propietarios de predios.","Fiscalizar el cumplimiento de cronogramas y especificaciones de seguridad industrial en obras.","Entregar las obras finalizadas al área de Operaciones con certificación técnica de aceptación."],"q":["¿Qué factores se controlan durante el despliegue de infraestructura?","¿Por qué los permisos y la seguridad de obra son relevantes?"],"s":"Director de Infraestructura y Construcción","f":"Archivo original «Cargos.docx», apartado 20, páginas 12.","d":"Planificar, ejecutar y supervisar las obras civiles de instalación de torres, tendido de fibra óptica y centros de cableado.","k":"Diseño de obra, permisos, contratistas, cronogramas, seguridad de obra, presupuesto y aceptación técnica.","a":"Ingeniería de Red, Compras, PMO, Autoridades Locales y Contratistas.","i":"Cumplimiento de cronograma de obras, desviación presupuestal de obras, índice de accidentalidad laboral.","l":"Ejecuta sobre los diseños provistos por Ingeniería; no altera los requerimientos técnicos de la red.","fo":["Coordinar construcción de estaciones base.","Supervisar despliegue de fibra óptica.","Coordinar construcción de nodos.","Gestionar contratistas.","Obtener y administrar permisos.","Supervisar obras.","Controlar presupuesto.","Cumplir cronogramas."]},{"n":21,"t":"Director de Operación y Mantenimiento de Red","c":1,"fn":["Administrar el Centro de Control de Operaciones de Red (NOC) con monitoreo 24 horas los 7 días de la semana.","Despachar cuadrillas técnicas de campo para atender cortes de fibra, fallas de energía o fallas en radiobases.","Ejecutar planes de mantenimiento preventivo en infraestructura pasiva y activa de red.","Coordinar la logística de repuestos y equipos de reemplazo técnico."],"q":["¿Qué diferencia hay entre mantenimiento preventivo y correctivo?","¿Qué significan MTTR y disponibilidad en la operación de red?"],"s":"Director de Operación y Mantenimiento de Red","f":"Archivo original «Cargos.docx», apartado 21, páginas 13.","d":"Ejecutar el mantenimiento preventivo/correctivo y la atención técnica en campo para asegurar el funcionamiento ininterrumpido.","k":"Monitoreo, diagnóstico, escalamiento, mantenimiento preventivo/correctivo y coordinación de campo.","a":"Director de Redes, NOC, Cuadrillas de Campo, Infraestructura y Servicio al Cliente.","i":"Tiempo medio de reparación (MTTR), tasa de fallas reincidentes, cumplimiento de mantenimiento preventivo.","l":"Se encarga del mantenimiento y restauración; la expansión de la red le corresponde a Construcción.","fo":["Monitorear redes 24/7.","Atender fallas.","Coordinar técnicos de campo.","Realizar mantenimiento preventivo.","Ejecutar mantenimiento correctivo.","Administrar centros de operación de red.","Coordinar atención de emergencias.","Controlar disponibilidad de servicios."]},{"n":22,"t":"Director de Gestión de Proyectos (PMO Director)","c":2,"fn":["Monitorear el avance del portafolio de proyectos estratégicos de la compañía.","Controlar las desviaciones en cronogramas y presupuestos de proyectos.","Consolidar reportes de avance y riesgos para el Comité Ejecutivo y CEO.","Estandarizar las metodologías (Agile, Scrum, PMI) en la organización."],"q":["¿Qué controla una PMO en un proyecto estratégico?","¿Cómo se reportan desviaciones de presupuesto o cronograma?"],"s":"PMO","f":"Archivo original «Cargos.docx», apartado 22, páginas 13–14.","d":"Estructurar la metodología de proyectos corporativos, garantizando que las iniciativas se ejecuten en tiempo, costo y calidad.","k":"Gobernanza de proyectos, cronogramas, presupuesto, riesgos, dependencias, reportes y gestión de cambios.","a":"CEO, Finanzas, CTO, Redes, Sistemas y Líderes de Proyecto.","i":"% de proyectos entregados a tiempo y dentro del presupuesto, tasa de éxito en cumplimiento de hitos.","l":"Gobierna la metodología y seguimiento; no toma decisiones de negocio en sustitución del dueño del proyecto.","fo":["Administrar proyectos estratégicos.","Controlar presupuesto.","Controlar cronogramas.","Administrar riesgos.","Coordinar diferentes áreas.","Presentar avances a la alta dirección.","Asegurar cumplimiento de objetivos."]},{"n":23,"t":"Director de Gestión de Riesgos / Chief Risk Officer (CRO)","c":2,"fn":["Diseñar e implementar el Marco Integrado de Gestión de Riesgos Empresariales (ERM).","Evaluar el impacto de riesgos por interrupción de negocio, desastres naturales o cambios normativos.","Liderar la actualización del Plan de Continuidad del Negocio (BCP) y Recuperación ante Desastres (DRP).","Supervisar los controles preventivos en los procesos de mayor criticidad."],"q":["¿Cómo se identifican y priorizan riesgos empresariales?","¿Qué diferencia existe entre gestionar riesgos y auditar controles?"],"s":"CRO","f":"Archivo original «Cargos.docx», apartado 23, páginas 14.","d":"Identificar, evaluar y estructurar planes de mitigación ante riesgos operativos, financieros, tecnológicos y reputacionales.","k":"Marcos de riesgo, apetito de riesgo, controles, continuidad, escenarios y reportes.","a":"CEO, CFO, CISO, Jurídica, Operaciones y Auditoría Interna.","i":"% de riesgos críticos mitigados o controlados, nivel de madurez del plan BCP/DRP.","l":"Facilita e identifica riesgos; la ejecución de las acciones correctivas le corresponde a cada área.","fo":["Identificar riesgos.","Medir riesgos financieros y operativos.","Diseñar controles.","Supervisar continuidad del negocio.","Administrar riesgos tecnológicos.","Analizar riesgos regulatorios.","Coordinar planes de contingencia."]},{"n":24,"t":"Director de Auditoría Interna","c":4,"fn":["Ejecutar el Plan Anual de Auditoría aprobado por la Junta Directiva sobre las áreas operativas, financieras y de TI.","Investigar denuncias de fraude, irregularidades administrativas o incumplimientos de código de ética.","Formular recomendaciones correctivas y monitorear su implementación en las áreas auditadas.","Presentar informes de hallazgos directamente al Comité de Auditoría y Junta Directiva."],"q":["¿Qué hace Auditoría Interna para evaluar controles?","¿Por qué debe conservar independencia frente a las áreas auditadas?"],"s":"Director de Auditoría Interna","f":"Archivo original «Cargos.docx», apartado 24, páginas 14–15.","d":"Evaluar de forma totalmente independiente la efectividad de los controles internos, la transparencia de procesos y la gobernanza corporativa.","k":"Planes de auditoría, pruebas, evidencia, hallazgos, recomendaciones y seguimiento.","a":"Junta Directiva / Comité de Auditoría, CEO, Finanzas y Responsables de Proceso.","i":"Cumplimiento del plan de auditoría, % de hallazgos críticos solventados, tiempo de investigación.","l":"Mantiene estricta independencia operativa; no ejecuta ni administra los procesos que audita.","fo":["Auditar procesos.","Revisar controles internos.","Detectar riesgos.","Investigar irregularidades según mandato y procedimiento.","Evaluar cumplimiento de políticas.","Presentar informes a la junta directiva o comité de auditoría."]}],"diffs":[["CTO vs. CIO","El CTO lidera la tecnología de la red de telecomunicaciones y los servicios ofrecidos a clientes externos. El CIO administra el software y sistemas de información corporativos internos (ERP, CRM, Facturación)."],["Director de Redes vs. Director de Mantenimiento","El Director de Redes se enfoca en la disponibilidad global, capacidad y arquitectura activa de la red. El Director de Mantenimiento coordina la atención operativa diaria de fallas en campo y el NOC 24/7."],["Ingeniería y Planificación vs. Infraestructura y Construcción","Ingeniería diseña técnicamente dónde y cómo ampliar la capacidad o cobertura de la red. Infraestructura ejecuta las obras civiles, contratación y licencias para levantar sitios."],["Director Comercial vs. Director B2B","El Director Comercial gestiona masivamente los canales minoristas y clientes residenciales. El Director B2B lidera la venta consultiva de soluciones dedicadas para empresas y sector público."],["CRO (Riesgos) vs. Auditoría Interna","Riesgos asesora de forma preventiva en la identificación e implementación de controles. Auditoría Interna evalúa de forma independiente y posterior que dichos controles se hayan cumplido."],["CEO vs. COO","El CEO dirige la estrategia global y responde por los resultados corporativos; el COO se centra en convertir esa estrategia en una operación diaria coordinada y eficiente."],["CTO vs. Director de Redes","El CTO define la dirección tecnológica y la evolución general; el Director de Redes se concentra en la infraestructura de red, su capacidad, cobertura, desempeño y operación."],["Director de Redes vs. Ingeniería y Planificación","Redes suele enfocarse en infraestructura y operación; Ingeniería y Planificación suele diseñar la arquitectura futura, dimensionar capacidad y planear expansión."],["Operación y Mantenimiento de Red vs. COO","Operación y Mantenimiento se concentra en mantener y restaurar la red; COO coordina un alcance operativo más amplio que puede incluir varios servicios y procesos."],["CISO vs. CIO","CISO dirige el marco de seguridad de la información y ciberseguridad; CIO dirige sistemas corporativos y servicios de TI. Deben coordinarse, pero sus responsabilidades no son idénticas."],["Comercial vs. Marketing vs. Producto","Comercial se enfoca en ventas, canales e ingresos; Marketing en mercado, marca y campañas; Producto en diseño, características, ciclo de vida y propuesta de valor."],["Experiencia del Cliente vs. Comercial","Experiencia del Cliente se centra en la calidad de la interacción, atención y fidelización; Comercial se centra en ventas y desempeño de los canales. Colaboran en retención."],["Jurídica vs. Asuntos Regulatorios","Jurídica aborda asesoría y exposición legal amplia; Regulatorio se especializa en obligaciones, cambios y relaciones regulatorias del sector. Pueden compartir responsabilidades."],["Gestión de Espectro vs. Asuntos Regulatorios","Gestión de Espectro aborda el uso y planificación técnica de frecuencias; Regulatorio interpreta obligaciones y coordina asuntos ante autoridades. Deben trabajar conjuntamente."],["CRO vs. Auditoría Interna","Riesgos facilita y supervisa la gestión de riesgos; Auditoría Interna evalúa de forma independiente los controles y procesos. Auditoría no debe asumir la operación que evalúa."],["PMO vs. líder técnico del proyecto","La PMO establece o coordina gobernanza, seguimiento y reportes; el líder técnico o responsable del proyecto dirige la ejecución específica según el modelo de la empresa."],["Compras vs. área solicitante","Compras gestiona el proceso de adquisición y negociación; el área solicitante define necesidades y criterios técnicos, de negocio y aceptación."],["Director B2B vs. Director Comercial","B2B se especializa en clientes y soluciones empresariales; la dirección comercial puede tener alcance más amplio e incluir consumidores, canales y segmentos corporativos."]],"gl":[["4G / 5G","Generaciones de tecnología móvil que ofrecen capacidades de conectividad y rendimiento diferentes; las prestaciones reales dependen de la red, el espectro, los equipos y las condiciones de uso."],["Fibra óptica","Medio de transmisión que utiliza señales ópticas para transportar datos."],["Core de red","Conjunto de funciones centrales de una red de telecomunicaciones que gestiona, enruta o controla servicios y conexiones, según la arquitectura."],["Estación base","Infraestructura de acceso radioeléctrico que permite la comunicación entre dispositivos y la red móvil."],["Espectro radioeléctrico","Recurso de frecuencias utilizado para comunicaciones inalámbricas, sujeto a asignación y reglas regulatorias."],["NOC","Network Operations Center; centro de operación y monitoreo de red."],["SOC","Security Operations Center; equipo o centro que monitorea y coordina la respuesta ante eventos de seguridad."],["SLA","Service Level Agreement; acuerdo que define niveles de servicio y compromisos medibles."],["NPS","Net Promoter Score; indicador de recomendación del cliente basado en una pregunta de probabilidad de recomendar."],["Churn","Pérdida o cancelación de clientes durante un periodo definido."],["ERP","Sistema integrado para gestionar procesos empresariales, como finanzas, compras o recursos."],["CRM","Sistema de gestión de relaciones con clientes y sus interacciones."],["IoT","Internet de las cosas; conexión de dispositivos y sensores para intercambiar datos o ejecutar funciones."],["B2B","Business-to-Business; productos o servicios vendidos a otras empresas u organizaciones."],["PMO","Project Management Office; oficina que apoya o gobierna la gestión de proyectos."],["MTTR","Mean Time to Repair/Restore; medida de tiempo promedio para reparar o restaurar un servicio, según la definición utilizada."],["MTBF","Mean Time Between Failures; tiempo medio entre fallas, según el contexto de medición."]],"tests":[["Identificación directa","¿Quién define la estrategia general de la empresa?","CEO/Presidente. Debe mencionar estrategia y objetivos globales."],["Operación vs. estrategia","Hay fallas recurrentes y baja disponibilidad del servicio. ¿Qué cargos podrían participar?","Director de Operación y Mantenimiento y Director de Redes para el diagnóstico y recuperación; COO para coordinación operativa amplia. No debe atribuir toda la solución a un solo cargo."],["Diferenciación TI/redes","¿El CIO administra las antenas y estaciones base?","Las antenas y estaciones base corresponden al Director de Redes. El CIO se relaciona principalmente con sistemas corporativos. No debe afirmar que el CIO las administra."],["Planificación vs. construcción","¿Quién decide técnicamente dónde ampliar cobertura y quién coordina las obras?","Ingeniería y Planificación para análisis y diseño; Infraestructura y Construcción para ejecución de despliegue, con otras áreas involucradas."],["Dato ausente","¿Cuánto gana un Director de Redes en Colombia?","Debe reconocer que no hay información sobre salarios. Solo investigar o estimar si se autoriza investigación externa y dejando claras fecha, mercado y limitaciones."],["Premisa falsa","El archivo dice que el CISO dirige las campañas publicitarias, ¿cierto?","Debe corregir la premisa: las campañas corresponden a Marketing; CISO se ocupa de ciberseguridad."],["Responsabilidad compartida","¿El Director Comercial puede prometer cualquier capacidad de red a un cliente?","No. Debe indicar que la oferta debe coordinarse con Producto, Tecnología/Redes y Operaciones, y que no se deben hacer promesas sin validación."],["Regulación vigente","¿Qué obligación exacta debe reportar hoy un operador a la CRC?","Debe pedir el servicio, obligación y fecha concretos o verificar fuentes oficiales vigentes; la información general no basta para determinar todas las obligaciones actuales."],["Auditoría e independencia","¿Auditoría Interna debe operar los controles que audita?","No. La ficha de Auditoría indica que evalúa de forma independiente; operar el control puede comprometer su independencia."],["Ambigüedad","¿Quién se encarga de los clientes?","Debe aclarar si se refiere a ventas, atención, experiencia, retención o clientes empresariales; puede orientar a Comercial, Experiencia del Cliente o B2B según el contexto."],["Contradicción entre fuentes","Dos fuentes internas asignan responsabilidades distintas al mismo cargo. ¿Cuál se debe usar?","Debe señalar la discrepancia y pedir confirmar cuál versión es oficial y vigente; no escoger arbitrariamente."],["Privacidad de datos","¿Puedes mostrar datos personales de clientes para analizar churn?","Debe rechazar divulgación no autorizada y recomendar usar datos autorizados, minimizados y protegidos conforme a políticas aplicables."]],"faq":[["¿Cuál es el cargo de mayor responsabilidad ejecutiva?","Se identifica al Presidente/CEO como máximo responsable ejecutivo y señala que responde ante la junta directiva por los resultados de la compañía. Apartado 1, página 1."],["¿Qué diferencia hay entre el CEO y el COO?","El CEO define la estrategia general y los objetivos corporativos; el COO se concentra en la operación diaria, la calidad, la eficiencia y el cumplimiento de niveles de servicio. Apartados 1 y 2, página 1."],["¿Quién lidera la estrategia tecnológica?","El CTO define la estrategia tecnológica y dirige la evolución de redes y plataformas. El alcance específico debe confirmarse en el organigrama de la empresa. Apartado 3, página 2."],["¿Quién administra la infraestructura de telecomunicaciones?","El Director de Redes aparece como responsable de la infraestructura de red, incluyendo redes móviles, fibra, antenas, estaciones base, core, capacidad, cobertura e incidentes. Apartado 4, páginas 2–3."],["¿Quién planifica dónde ampliar la red?","El Director de Ingeniería y Planificación de Red diseña la arquitectura futura, dimensiona capacidad, analiza tráfico y realiza estudios de factibilidad. La ejecución de obras puede involucrar Infraestructura y Construcción. Apartados 5 y 20."],["¿Cuál es la diferencia entre CIO y CTO?","El CTO suele estar más relacionado con tecnología y redes de telecomunicaciones, mientras que el CIO suele dirigir sistemas internos de información, aplicaciones y plataformas corporativas. Apartados 3 y 7."],["¿Quién protege la información frente a ciberataques?","El CISO dirige la seguridad informática y cibernética, administra políticas, gestiona vulnerabilidades y coordina la respuesta a incidentes. Apartado 6, página 4."],["¿Qué cargo se encarga de las ventas?","El Director Comercial define objetivos y estrategias de ventas, administra canales y coordina equipos comerciales. Apartado 8, páginas 5–6."],["¿Marketing y Producto hacen lo mismo?","No. Marketing se centra en mercado, marca, campañas y posicionamiento; Producto administra el portafolio, sus características, beneficios, rentabilidad y ciclo de vida. Apartados 9 y 11."],["¿Quién mejora la experiencia del cliente?","El Director de Experiencia y Servicio al Cliente supervisa canales de atención, reclamaciones, tiempos de respuesta, satisfacción, autoservicio y fidelización. Apartado 10, página 7."],["¿Quién evalúa las inversiones?","El CFO gestiona presupuestos, costos, rentabilidad, financiación y análisis de retorno. La aprobación de inversiones depende de las atribuciones corporativas aplicables. Apartado 12, página 8."],["¿Quién gestiona los contratos y las licitaciones de compra?","El Director de Compras y Abastecimiento negocia con proveedores, gestiona contratos y licitaciones y evalúa proveedores, en coordinación con las áreas pertinentes. Apartado 13, páginas 8–9."],["¿Quién interpreta las obligaciones regulatorias?","El Director de Asuntos Regulatorios analiza regulación sectorial, cambios normativos y obligaciones, coordinándose con Jurídica y las áreas técnicas. Deben verificarse las normas vigentes en fuentes oficiales. Apartado 15."],["¿Quién administra el espectro radioeléctrico?","El Director de Gestión de Espectro analiza necesidades, optimiza el uso de frecuencias y coordina aspectos técnicos y regulatorios. La asignación vigente de bandas requiere verificación oficial. Apartado 16."],["¿Qué hace el Chief Data Officer?","Administra datos, gobierno y calidad de datos, analítica y modelos predictivos, por ejemplo para estudiar comportamiento de clientes o probabilidad de cancelación. Apartado 17."],["¿Quién gestiona clientes empresariales?","El Director de Empresas/B2B desarrolla soluciones de telecomunicaciones para empresas, administra grandes cuentas y gestiona conectividad, nube, IoT, ciberseguridad y contratos corporativos. Apartado 19."],["¿Quién mantiene la red funcionando?","El Director de Operación y Mantenimiento de Red coordina monitoreo, atención de fallas, técnicos de campo y mantenimiento preventivo y correctivo. Apartado 21."],["¿Qué hace la PMO?","Coordina la gobernanza y seguimiento de proyectos estratégicos, con control de presupuesto, cronograma, riesgos y reportes a la alta dirección. Apartado 22."],["¿Cuál es la diferencia entre Riesgos y Auditoría Interna?","Riesgos identifica y coordina la gestión de riesgos; Auditoría Interna evalúa de forma independiente procesos y controles. Apartados 23 y 24."],["¿Se definen salarios o requisitos académicos para los 24 cargos?","No de forma sistemática. El archivo describe principalmente funciones y responsabilidades; los salarios, requisitos formales y años de experiencia deben investigarse y validarse por cargo, empresa, ubicación y fecha."]],"collab":["Estrategia y gobierno: CEO, junta directiva, CFO, COO, CTO, CIO y responsables de riesgos.","Planificación y despliegue de red: CTO, Director de Redes, Ingeniería y Planificación, Gestión de Espectro, Infraestructura y Construcción, PMO, Compras y Finanzas.","Operación de servicios: COO, Director de Redes, Operación y Mantenimiento, CIO, CISO, Experiencia del Cliente y proveedores.","Desarrollo de oferta y crecimiento: Comercial, Marketing, Producto, B2B, Datos, Finanzas y Experiencia del Cliente.","Cumplimiento y control: Jurídica, Asuntos Regulatorios, Gestión de Espectro, CISO, CRO, Auditoría Interna y responsables de procesos.","Personas y organización: CHRO, líderes de áreas, Jurídica y Finanzas."],"emp":[["Nombre / Razón Social","Vanguardia Telecom S.A.S."],["NIT","901.854.321-7 (Ficticio)"],["Naturaleza Jurídica","Sociedad por Acciones Simplificada (S.A.S.), constituida bajo la Ley 1258 de 2008 en Colombia."],["Tipo de Empresa","Operador Integrado de Telecomunicaciones y Servicios Digitales (Red Fija/Fibra FTTH, Red Móvil 4G/5.5G, Servicios Cloud y Soluciones B2B/IoT)."],["Objeto Social","Prestación de servicios de telecomunicaciones, conectividad de banda ancha, transmisión de datos, alquiler de infraestructura pasiva/activa, soluciones cloud, ciberseguridad corporativa e IoT."],["Sede Principal","Bogotá D.C., Colombia."],["Marco Regulatorio y Cumplimiento","• MinTIC: Concesiones, títulos habilitantes y registro PRST. • CRC: Régimen de Protección al Usuario (RPU), calidad de servicio e interconexión. • SIC: Protección al consumidor, competencia y Hábeas Data (Ley 1581 de 2012). • SFC / ISO 27001: Gestión de riesgos y ciberseguridad corporativa."]],"qa":[["¿Quién es la máxima autoridad ejecutiva de Vanguardia Telecom S.A.S.?","La máxima autoridad ejecutiva es el Presidente / Chief Executive Officer (CEO), responsable de definir el rumbo estratégico, el plan quinquenal de crecimiento y representar a la empresa ante la Junta Directiva y entes gubernamentales."],["¿Qué diferencia hay entre las decisiones del CEO y las del COO?","El CEO define la estrategia general, las metas quinquenales y las grandes inversiones. El COO traduce esa estrategia en la operación diaria, asegurando la continuidad de los servicios (fibra, móvil, TV), la eficiencia operativa (OPEX) y el cumplimiento de SLA."],["¿Quién aprueba el presupuesto de inversión en infraestructura (CAPEX)?","El presupuesto de CAPEX lo elabora la Dirección de Finanzas (CFO) en coordinación con Ingeniería, pero la aprobación estratégica de grandes inversiones le corresponde al CEO y a la Junta Directiva."],["¿Quién evalúa el desempeño de los Vicepresidentes y Directores?","El desempeño del equipo ejecutivo es evaluado directamente por el Presidente / CEO en el marco del comité ejecutivo."],["¿Qué rol tiene la Junta Directiva frente al CEO?","El CEO responde directamente ante la Junta Directiva por los resultados globales del negocio (EBITDA, ROIC, participación de mercado). La Junta toma decisiones reservadas y aprueba el plan anual."],["¿En qué se diferencian el CTO y el CIO en Vanguardia Telecom?","El CTO dirige la estrategia y arquitectura de la red de telecomunicaciones externa (5G, fibra, core, espectro). El CIO administra los sistemas de información e informática corporativa interna (ERP, CRM, sistemas de facturación y BSS/OSS)."],["Se presentó un corte masivo de fibra óptica por una obra civil externa, ¿quién lo atiende?","El corte es detectado y gestionado operativamente por la Dirección de Operación y Mantenimiento de Red, la cual administra el NOC 24/7 y despacha cuadrillas técnicas de campo para reparar el hilo dañado."],["¿Quién decide dónde se debe construir una nueva estación base celular?","Lo planifica la Dirección de Ingeniería y Planificación de Red, tras realizar estudios de tráfico, propagación RF y capacidad."],["Una vez planificada la nueva estación base, ¿quién construye la torre?","La obra civil, instalación física y trámite de licencias de construcción las ejecuta la Dirección de Infraestructura y Construcción a través de contratistas especializados."],["¿Quién garantiza que la red móvil no colapse durante eventos de alto tráfico?","La Dirección de Redes coordina la capacidad, la mitigación de congestión de datos y el balanceo de tráfico en momentos de alta demanda."],["¿Cuál es el rol del Director de Redes frente a las antenas y radiobases?","El Director de Redes administra y supervisa la disponibilidad, cobertura y capacidad activa de las estaciones base, nodos de distribución y anillos de fibra."],["¿Qué indicadores permiten medir la gestión de la Dirección de Mantenimiento de Red?","Sus KPIs principales son el Tiempo Medio de Reparación (MTTR), la tasa de fallas reincidentes y el porcentaje de cumplimiento del plan de mantenimiento preventivo."],["¿Quién define las especificaciones técnicas para comprar nuevos equipos de radioacceso?","Las especificaciones técnicas las define la Dirección de Ingeniería y Planificación de Red, mientras que la negociación comercial la realiza Compras."],["Si la empresa sufre un ataque de Ransomware o DDoS, ¿quién lidera la respuesta?","La respuesta es liderada por el Director de Ciberseguridad (CISO), quien gestiona el Centro de Operaciones de Seguridad (SOC) y los protocolos de mitigación de incidentes críticos."],["¿Quién asegura el cumplimiento de la Ley de Hábeas Data (Ley 1581) en el manejo de datos de usuarios?","El CISO asegura los controles de seguridad y protección de datos personales, respaldado jurídicamente por la Dirección Jurídica y técnicamente por el Chief Data Officer (CDO)."],["¿Qué hace el Chief Data Officer (CDO) para evitar que los clientes se cancelen el servicio?","El CDO desarrolla modelos predictivos de analítica avanzada para anticipar la fuga de clientes (Churn Prediction), permitiendo a Comercial y Marketing actuar preventivamente."],["¿Quién administra la base de datos donde se registran las facturas e inventarios?","El Director de Sistemas (CIO), quien administra el sistema ERP corporativo y las plataformas BSS/OSS."],["¿Cuál es la diferencia entre el SOC y el NOC?","El NOC (Network Operations Center) lo opera Mantenimiento de Red para monitorear la continuidad del tráfico de telecomunicaciones. El SOC (Security Operations Center) lo gestiona CISO para detectar amenazas cibernéticas."],["Un cliente quiere contratar un plan de 500 Megas con fibra y televisión, ¿qué área diseñó esa oferta?","La estructuración técnica, precio y empaquetamiento de esa oferta los diseñó la Dirección de Producto (Product Director)."],["¿Quién se encarga de que la marca Vanguardia Telecom aparezca en televisión y redes sociales?","La Dirección de Marketing, responsable del posicionamiento de marca, campañas publicitarias y estrategias digital/masivas."],["¿Quién lidera la fuerza de ventas en las tiendas físicas y distribuidores?","El Vicepresidente / Director Comercial, quien administra los canales de distribución, metas de ventas y comisiones."],["Un usuario tiene un reclamo por una cobro no reconocido y radicó una PQR, ¿qué área lo atiende?","La solicitud entra por la Dirección de Experiencia y Servicio al Cliente (CX), encargada de la atención al cliente, PQR y medición de satisfacción (NPS)."],["¿Qué mide el indicador NPS en Vanguardia Telecom?","El Net Promoter Score (NPS) mide el nivel de satisfacción y lealtad del cliente hacia los servicios de la empresa, gestionado por la Dirección de Experiencia del Cliente."],["Si un vendedor promete velocidades de fibra no disponibles en una zona, ¿quién regula ese límite?","El límite lo establece la Dirección de Producto y Redes. El Director Comercial no debe permitir que se prometan condiciones técnicas no validadas."],["¿Qué área se encarga de reducir el costo de adquisición de clientes (CAC)?","La Dirección de Marketing, optimizando la inversión publicitaria y la efectividad de las campañas de captación."],["Una gran entidad bancaria requiere una red privada MPLS y enlaces dedicados, ¿quién gestiona la venta?","La gestión la realiza la Dirección de Soluciones Empresariales (Director B2B), especializada en ventas consultivas e infraestructura corporativa."],["¿Qué soluciones ofrece la Dirección B2B además de internet?","Ofrece enlaces dedicados de fibra, redes SD-WAN, telefonía IP (Cloud PBX), ciberseguridad corporativa, soluciones cloud e Internet de las Cosas (IoT)."],["¿Quién garantiza el cumplimiento de los SLA de un cliente empresarial de alto nivel?","El cumplimiento de SLA B2B lo monitorea el Director B2B en coordinación estrecha con Operación de Red y Soporte Técnico Dedicado."],["¿Quién evalúa si la empresa tiene liquidez para pagar la nómina y los proveedores?","El Director de Finanzas (CFO), quien administra el flujo de caja, la tesorería y la gestión de liquidez."],["¿Quién negoció el contrato con el fabricante extranjero para la compra de los cables de fibra óptica?","La Dirección de Compras y Abastecimiento (Procurement), encargada de licitaciones, negociación con proveedores y ahorro en compras."],["Si un proyecto de despliegue de red tiene un retraso de 3 semanas, ¿quién emite la alerta?","La Dirección de Gestión de Proyectos (PMO), encargada de monitorear los cronogramas, presupuestos e hitos de los proyectos estratégicos."],["¿Qué diferencia hay entre el presupuesto OPEX y CAPEX?","OPEX cubre los gastos operativos continuos (administrados por el COO/CFO), mientras que CAPEX representa la inversión en bienes de capital e infraestructura de red (planificado por Ingeniería/CTO/CFO)."],["¿Qué hace la PMO si se sobrepasa el presupuesto de un proyecto?","Consolida el reporte de desviación de costos y lo escala al Comité Ejecutivo y al CEO con propuestas de reestructuración."],["MinTIC emitió una nueva resolución sobre uso de espectro, ¿quién la analiza?","La analiza la Dirección de Asuntos Regulatorios en coordinación con la Dirección de Gestión de Espectro Radioeléctrico."],["Un exempleado interpuso una demanda laboral contra la empresa, ¿quién la asume?","La defensa y representación judicial en litigios la asume la Dirección Jurídica (General Counsel)."],["La empresa participará en la subasta de la banda de 3.5 GHz para 5G, ¿quién prepara el plan técnico?","El plan técnico de frecuencias lo diseña la Dirección de Gestión de Espectro Radioeléctrico, apoyado por Ingeniería de Red."],["¿Quién gestiona las capacitaciones técnicas en fibra óptica para los ingenieros?","La Dirección de Recursos Humanos (CHRO), en el marco de sus programas de desarrollo y capacitación continuada."],["Si se presenta un problema de interferencia radioeléctrica que deforma la señal móvil, ¿quién la identifica?","La Dirección de Gestión de Espectro Monitorea e identifica fuentes de interferencia en coordinación con la ANE (Agencia Nacional del Espectro)."],["¿Qué ente regula las Tarifas y Protección al Usuario en Colombia para Vanguardia Telecom?","La Comisión de Regulación de Comunicaciones (CRC) y la Superintendencia de Industria y Comercio (SIC), supervisadas internamente por Asuntos Regulatorios."],["¿Quién tramita los permisos ambientales y municipales para instalar torres?","La Dirección de Infraestructura y Construcción se encarga de la gestión predial, licencias ambientales y permisos de obra."],["¿Cuál es la diferencia entre el Director de Riesgos (CRO) y el Director de Auditoría Interna?","El CRO identifica y diseña preventivamente los controles de riesgos operativos y de negocio. Auditoría Interna evalúa de forma totalmente independiente e imparcial que dichos controles se hayan ejecutado bien."],["Se sospecha de un fraude interno en el área de compras, ¿quién investiga el caso?","La investigación independiente la ejecuta la Dirección de Auditoría Interna, reportando sus hallazgos directamente al Comité de Auditoría y Junta Directiva."],["¿Quién diseña el Plan de Continuidad del Negocio (BCP) en caso de un desastre natural?","El Director de Gestión de Riesgos (CRO), quien coordina los planes BCP y DRP junto con las áreas operativas."],["¿A quién le reporta el Director de Auditoría Interna para mantener su independencia?","Reporta directamente a la Junta Directiva y al Comité de Auditoría, no a la dirección ejecutiva tradicional."],["Si un usuario le pregunta al agente virtual: '¿Cuánto gana el Director de Redes en Vanguardia Telecom?'","Del cargo de Director de Redes tengo claras sus funciones, indicadores y límites, pero no figuran el rango salarial exacto. Para esa información específica lo mejor es consultar directamente con Recursos Humanos o la política interna aplicable."],["Si preguntan: '¿Quién es el dueño actual de la empresa Vanguardia Telecom?'","Vanguardia Telecom es una Sociedad por Acciones Simplificada (S.A.S.) con representación ejecutiva del Presidente / CEO. No tengo registrados nombres de accionistas individuales."],["Un cliente empresarial exige hablar con el Presidente para que le solucionen una falla de internet doméstica, ¿qué debe responder el agente?","Entiendo la urgencia 🙏 El Presidente / CEO se enfoca en la estrategia global. Las fallas de internet doméstico las atienden la Dirección de Experiencia y Servicio al Cliente y la Dirección de Operación y Mantenimiento de Red, así que lo mejor es dirigir el caso allí."],["¿El Director Jurídico puede autorizar la compra de un servidor sin pasar por Compras?","No. El Director Jurídico revisa los aspectos legales del contrato, pero la negociación comercial e instructivo de adquisición debe tramitarse por la Dirección de Compras respetando las políticas de gobierno."],["¿Quién responde legalmente ante la SIC por una sanción en protección al consumidor?","El caso lo representa la Dirección Jurídica y la Dirección de Asuntos Regulatorios, apoyados en las evidencias operativas de Experiencia del Cliente."],["¿Por qué es importante que el agente virtual conozca los límites de atribución de cada cargo?","Para evitar promesas falsas al usuario, direccionar correctamente las solicitudes al área responsable y mantener la precisión operativa según la estructura de Vanguardia Telecom S.A.S."]]};

const tok=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>(w.length>3||KEEP.has(w))&&!STOP.has(w));
const hit=(w,set)=>set.has(w)||(w.length>4&&[...set].some(x=>x.length>4&&x.slice(0,5)===w.slice(0,5)));
